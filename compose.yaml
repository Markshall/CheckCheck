services:
  web:
    build: .
    ports:
      # PORT lets each worktree run its own server; see scripts/dev-worktree.sh.
      - "${PORT:-5174}:5174"
    volumes:
      - .:/app
      # Keep the container's node_modules separate from the host's.
      - node_modules:/app/node_modules

volumes:
  node_modules:
