name: Check

# Audit, test, type check and build pull requests before they're merged.
# Needs no secrets and never deploys.
on:
  pull_request:
    branches: [master]

concurrency:
  group: check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      # Only what ships to phones. Dev tools (Vite, TypeScript, Playwright)
      # never leave this machine or the runner.
      - run: npm audit --omit=dev
      - run: npm test
      # Type checks (tsc) before building.
      - run: npm run build

      # The page and its service worker, in a phone-sized Chromium, online
      # and offline.
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
